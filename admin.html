<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fiorella B'Pizzas</title>
  <link rel="icon" href="images/isotipo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0a0a;
      --surface:  #1a1010;
      --panel:    #221414;
      --border:   rgba(255,192,29,0.15);
      --gold:     #FFC01D;
      --red:      #FF302B;
      --wine:     #901A07;
      --white:    #ffffff;
      --muted:    rgba(255,255,255,0.45);
      --danger:   #ff4444;
      --green:    #2AB153;
      --font:     'Poppins', sans-serif;
    }

    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg);
      font-family: var(--font);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── LOGIN ── */
    #loginScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #loginScreen.hidden { display: none; }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .login-logo img { width: 80%; height: 80%; object-fit: contain; }
    .login-box h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .login-box p  { font-size: 0.8rem; color: var(--muted); margin-bottom: 28px; }

    .login-field { margin-bottom: 14px; text-align: left; }
    .login-field label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); display: block; margin-bottom: 6px; }
    .login-field input {
      width: 100%; padding: 11px 14px;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--white); font-family: var(--font); font-size: 0.9rem;
      transition: border-color 0.15s;
    }
    .login-field input:focus { outline: none; border-color: var(--gold); }

    .login-btn {
      width: 100%; padding: 12px;
      background: var(--gold);
      border: none; border-radius: 10px;
      color: #1a1010; font-weight: 700; font-size: 0.9rem;
      font-family: var(--font); cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 6px;
    }
    .login-btn:hover { background: #e5a800; }
    .login-btn:active { transform: scale(0.98); }
    .login-error { color: var(--danger); font-size: 0.78rem; margin-top: 10px; min-height: 20px; }

    /* ── LAYOUT ── */
    #adminApp { display: none; min-height: 100vh; }
    #adminApp.visible { display: flex; }

    .admin-sidebar {
      width: 240px; min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-brand {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-brand-logo {
      width: 38px; height: 38px;
      background: var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    }
    .sidebar-brand-logo img { width: 80%; object-fit: contain; }
    .sidebar-brand-text { font-size: 0.8rem; font-weight: 700; line-height: 1.2; }
    .sidebar-brand-sub  { font-size: 0.62rem; color: var(--gold); font-weight: 400; }

    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section-label {
      font-size: 0.55rem; text-transform: uppercase; letter-spacing: 2.5px;
      color: var(--muted); padding: 0 8px; margin: 16px 0 6px;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 9px 12px;
      background: none; border: none; border-radius: 8px;
      color: var(--muted); font-family: var(--font); font-size: 0.82rem;
      cursor: pointer; transition: all 0.15s; text-align: left;
    }
    .nav-btn:hover { background: var(--panel); color: var(--white); }
    .nav-btn.active { background: rgba(255,192,29,0.12); color: var(--gold); font-weight: 600; }
    .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
    }
    .logout-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 12px;
      background: none; border: 1px solid rgba(255,68,68,0.3);
      border-radius: 8px; color: var(--danger);
      font-family: var(--font); font-size: 0.82rem; cursor: pointer;
      transition: all 0.15s;
    }
    .logout-btn:hover { background: rgba(255,68,68,0.1); }

    /* ── MAIN ── */
    .admin-main {
      margin-left: 240px;
      flex: 1;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }

    .admin-topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 1.1rem; font-weight: 700; }
    .topbar-actions { display: flex; gap: 10px; }

    .btn-primary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: var(--gold); border: none; border-radius: 8px;
      color: #1a1010; font-weight: 700; font-size: 0.8rem;
      font-family: var(--font); cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #e5a800; }

    .btn-secondary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      color: var(--white); font-size: 0.8rem;
      font-family: var(--font); cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: var(--surface); }

    .admin-content { padding: 28px; flex: 1; }

    /* ── TABS CATEGORÍAS ── */
    .cat-tabs {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .cat-tab {
      padding: 7px 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); font-family: var(--font); font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s;
    }
    .cat-tab:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
    .cat-tab.active { background: var(--gold); border-color: var(--gold); color: #1a1010; font-weight: 700; }

    /* ── GRID DE PRODUCTOS ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    .product-card:hover { border-color: rgba(255,192,29,0.35); transform: translateY(-2px); }

    .product-card-img {
      width: 100%; height: 140px;
      background: var(--panel);
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .product-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-card-img-placeholder { font-size: 3rem; opacity: 0.3; }

    .product-card-img-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      opacity: 0; transition: opacity 0.2s;
    }
    .product-card:hover .product-card-img-overlay { opacity: 1; }

    .img-action-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.9);
      border: none; border-radius: 6px;
      color: #1a1010; font-size: 0.72rem; font-weight: 600;
      font-family: var(--font); cursor: pointer;
    }

    .product-card-body { padding: 14px; }
    .product-card-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .product-card-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.4; margin-bottom: 10px; }

    .product-card-sizes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .size-tag {
      padding: 3px 10px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 20px; font-size: 0.68rem; color: var(--gold);
    }

    .product-card-actions {
      display: flex; gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .action-btn {
      flex: 1; padding: 7px;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); font-family: var(--font); font-size: 0.7rem;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .action-btn:hover { background: var(--surface); color: var(--white); border-color: rgba(255,255,255,0.2); }
    .action-btn.danger:hover { background: rgba(255,68,68,0.1); color: var(--danger); border-color: rgba(255,68,68,0.3); }

    /* ── MODAL EDICIÓN ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 500;
      align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }

    .edit-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
    }

    .edit-modal-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .edit-modal-head h3 { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: var(--panel); border: none; border-radius: 50%;
      width: 32px; height: 32px; color: var(--muted);
      font-size: 1rem; cursor: pointer; transition: all 0.15s;
    }
    .modal-close:hover { color: var(--white); background: var(--border); }

    .edit-modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
    .field-group input,
    .field-group textarea,
    .field-group select {
      padding: 10px 14px;
      background: var(--panel); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--white);
      font-family: var(--font); font-size: 0.88rem;
      transition: border-color 0.15s; resize: none;
    }
    .field-group input:focus,
    .field-group textarea:focus,
    .field-group select:focus { outline: none; border-color: var(--gold); }
    .field-group select option { background: var(--panel); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Tamaños dinámicos */
    .sizes-list { display: flex; flex-direction: column; gap: 8px; }
    .size-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    }
    .size-row input {
      flex: 1; background: none; border: none;
      color: var(--white); font-family: var(--font); font-size: 0.85rem; padding: 0;
    }
    .size-row input:focus { outline: none; }
    .size-row-sep { color: var(--muted); }
    .size-row-price { width: 80px; text-align: right; color: var(--gold); font-weight: 600; }
    .size-del-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 0 4px;
      transition: color 0.15s;
    }
    .size-del-btn:hover { color: var(--danger); }
    .add-size-btn {
      padding: 8px; background: none;
      border: 1px dashed var(--border); border-radius: 8px;
      color: var(--muted); font-family: var(--font); font-size: 0.78rem;
      cursor: pointer; transition: all 0.15s; width: 100%; text-align: center;
    }
    .add-size-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Toggle switch */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-label { font-size: 0.85rem; }
    .toggle {
      position: relative; width: 44px; height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 24px; cursor: pointer; transition: all 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--muted); left: 2px; top: 2px;
      transition: all 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--gold); border-color: var(--gold); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: #1a1010; }

    .edit-modal-foot {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--surface);
    }

    /* ── UPLOAD IMG ── */
    .img-upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px; padding: 24px;
      text-align: center; cursor: pointer;
      transition: all 0.15s; position: relative;
    }
    .img-upload-zone:hover { border-color: var(--gold); }
    .img-upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .img-upload-zone p { font-size: 0.8rem; color: var(--muted); }
    .img-upload-zone strong { color: var(--gold); }
    .img-preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

    /* ── PAPELERA ── */
    .trash-card {
      background: var(--surface);
      border: 1px solid rgba(255,68,68,0.2);
      border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .trash-card-info { flex: 1; }
    .trash-card-name { font-weight: 600; font-size: 0.9rem; }
    .trash-card-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .trash-days {
      font-size: 0.68rem; padding: 3px 10px;
      border-radius: 20px; font-weight: 600;
    }
    .trash-days.urgent { background: rgba(255,68,68,0.15); color: var(--danger); }
    .trash-days.ok     { background: rgba(42,177,83,0.1);  color: var(--green); }
    .trash-actions { display: flex; gap: 6px; }

    /* ── STATS ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 20px;
    }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--gold); }
    .stat-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* ── TOAST ── */
    #adminToast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px;
      font-size: 0.82rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 9999; opacity: 0;
      transition: opacity 0.25s; pointer-events: none;
      max-width: 300px;
    }
    #adminToast.show { opacity: 1; }
    #adminToast.success { border-color: var(--green); color: var(--green); }
    #adminToast.error   { border-color: var(--danger); color: var(--danger); }

    /* ── LOADING ── */
    .loading-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: var(--muted); gap: 12px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EXTRAS PANEL ── */
    .extras-list { display: flex; flex-direction: column; gap: 8px; }
    .extra-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    }
    .extra-row-name { flex: 1; font-size: 0.88rem; }
    .extra-row-price { color: var(--gold); font-weight: 600; font-size: 0.88rem; min-width: 48px; text-align: right; }
    .extra-row-actions { display: flex; gap: 6px; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 0.88rem; }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <img src="images/isotipo.png" alt="Logo" onerror="this.style.display='none'">
    </div>
    <h1>Panel Administrativo</h1>
    <p>Fiorella B'Pizzas — acceso restringido</p>
    <div class="login-field">
      <label>Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="admin@fiorella.com" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="adminApp">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <img src="images/isotipo.png" alt="Logo" onerror="this.style.display='none'">
      </div>
      <div>
        <div class="sidebar-brand-text">Fiorella B'Pizzas</div>
        <div class="sidebar-brand-sub">Panel admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">General</div>
      <button class="nav-btn active" onclick="showSection('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <div class="nav-section-label">Menú</div>
      <button class="nav-btn" onclick="showSection('productos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
        Productos
      </button>
      <button class="nav-btn" onclick="showSection('extras')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Ingredientes extras
      </button>
      <div class="nav-section-label">Negocio</div>
      <button class="nav-btn" onclick="showSection('sucursales')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Sucursales
      </button>
      <button class="nav-btn" onclick="showSection('papelera')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Papelera
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="doLogout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">

    <!-- TOPBAR -->
    <div class="admin-topbar">
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>

    <!-- CONTENT -->
    <div class="admin-content" id="adminContent">
      <div class="loading-spinner"><div class="spinner"></div> Cargando...</div>
    </div>

  </main>
</div>

<!-- ══ MODAL EDICIÓN PRODUCTO ══ -->
<div class="modal-overlay" id="productModal">
  <div class="edit-modal">
    <div class="edit-modal-head">
      <h3 id="modalTitle">Editar producto</h3>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>
    <div class="edit-modal-body">

      <div class="field-group">
        <label>Imagen del producto</label>
        <div class="img-upload-zone" id="imgUploadZone">
          <input type="file" id="imgFileInput" accept="image/*" onchange="previewImg(event)">
          <p>📸 <strong>Haz clic</strong> para subir imagen</p>
          <p style="font-size:0.7rem;margin-top:4px">JPG, PNG o WebP · máx 2MB</p>
          <img class="img-preview" id="imgPreview" style="display:none">
        </div>
      </div>

      <div class="field-group">
        <label>Nombre</label>
        <input type="text" id="pName" placeholder="Ej: Margarita">
      </div>

      <div class="field-group">
        <label>Descripción</label>
        <textarea id="pDesc" rows="3" placeholder="Ingredientes y descripción del producto"></textarea>
      </div>

      <div class="field-group">
        <label>Categoría</label>
        <select id="pCategory"></select>
      </div>

      <div class="field-group">
        <label>Tamaños y precios</label>
        <div class="sizes-list" id="sizesList"></div>
        <button class="add-size-btn" onclick="addSizeRow()">+ Agregar tamaño</button>
      </div>

      <div class="field-group">
        <div class="toggle-row">
          <span class="toggle-label">Permite ingredientes adicionales</span>
          <label class="toggle">
            <input type="checkbox" id="pAllowExtras" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="field-group" id="freeExtrasField">
        <label>Ingredientes gratis incluidos</label>
        <input type="number" id="pFreeExtras" min="0" max="10" value="0">
      </div>

    </div>
    <div class="edit-modal-foot">
      <button class="btn-secondary" onclick="closeProductModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveProduct()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- ══ MODAL EXTRA ══ -->
<div class="modal-overlay" id="extraModal">
  <div class="edit-modal" style="max-width:400px">
    <div class="edit-modal-head">
      <h3 id="extraModalTitle">Ingrediente extra</h3>
      <button class="modal-close" onclick="closeExtraModal()">✕</button>
    </div>
    <div class="edit-modal-body">
      <div class="field-group">
        <label>Nombre</label>
        <input type="text" id="eName" placeholder="Ej: Champiñón">
      </div>
      <div class="field-group">
        <label>Precio ($)</label>
        <input type="number" id="ePrice" min="0" step="0.5" placeholder="1.00">
      </div>
    </div>
    <div class="edit-modal-foot">
      <button class="btn-secondary" onclick="closeExtraModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveExtra()">Guardar</button>
    </div>
  </div>
</div>

<!-- ══ MODAL SUCURSAL ══ -->
<div class="modal-overlay" id="branchModal">
  <div class="edit-modal" style="max-width:440px">
    <div class="edit-modal-head">
      <h3 id="branchModalTitle">Sucursal</h3>
      <button class="modal-close" onclick="closeBranchModal()">✕</button>
    </div>
    <div class="edit-modal-body">
      <div class="field-group">
        <label>Nombre</label>
        <input type="text" id="bName" placeholder="Ej: San Jacinto">
      </div>
      <div class="field-group">
        <label>Dirección</label>
        <input type="text" id="bAddr" placeholder="Ej: Parque de Ferias San Jacinto">
      </div>
      <div class="field-group">
        <label>Teléfonos (uno por línea, formato 584XXXXXXXXX)</label>
        <textarea id="bPhones" rows="3" placeholder="584220459596&#10;584243443278"></textarea>
      </div>
    </div>
    <div class="edit-modal-foot">
      <button class="btn-secondary" onclick="closeBranchModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveBranch()">Guardar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="adminToast"></div>

<script src="js/supabase.js"></script>
<script>
// ═══════════════════════════════════════════
//  admin.js — Panel CMS Fiorella B'Pizzas
// ═══════════════════════════════════════════

var currentSection  = 'dashboard';
var currentCatFilter = null;
var editingProductId = null;
var editingExtraId   = null;
var editingBranchId  = null;
var uploadedImgUrl   = null;
var allCategories    = [];
var allProducts      = [];
var allExtras        = [];
var allBranches      = [];

// ── AUTH ──────────────────────────────────────────────────────────────────────
function sbAuth(endpoint, body) {
  return fetch(SUPABASE_URL + '/auth/v1/' + endpoint, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  }).then(function(r) { return r.json(); });
}

var authToken = null;

function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass  = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  errEl.textContent = '';

  if (!email || !pass) { errEl.textContent = 'Completa todos los campos.'; return; }

  sbAuth('token?grant_type=password', { email: email, password: pass })
    .then(function(data) {
      if (data.access_token) {
        authToken = data.access_token;
        sessionStorage.setItem('admin_token', authToken);
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminApp').classList.add('visible');
        loadAllData().then(function() { showSection('dashboard'); });
      } else {
        errEl.textContent = 'Credenciales incorrectas.';
      }
    })
    .catch(function() { errEl.textContent = 'Error de conexión.'; });
}

function doLogout() {
  authToken = null;
  sessionStorage.removeItem('admin_token');
  document.getElementById('adminApp').classList.remove('visible');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPassword').value = '';
}

// Enter en el login
document.getElementById('loginPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginEmail').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── FETCH AUTENTICADO ─────────────────────────────────────────────────────────
function sbAuthFetch(method, table, params, body) {
  var url = SUPABASE_URL + '/rest/v1/' + table + (params ? '?' + params : '');
  return fetch(url, {
    method: method || 'GET',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (authToken || SUPABASE_KEY),
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : 'return=representation',
    },
    body: body ? JSON.stringify(body) : undefined,
  }).then(function(r) {
    if (r.status === 204) return null;
    return r.json();
  });
}

// ── CARGAR DATOS ──────────────────────────────────────────────────────────────
function loadAllData() {
  return Promise.all([
    sbFetch('categories',    'select=*&order=sort_order'),
    sbFetch('products',      'select=*&order=sort_order'),
    sbFetch('product_sizes', 'select=*&order=sort_order'),
    sbFetch('extras',        'select=*&order=sort_order'),
    sbFetch('branches',      'select=*&order=sort_order'),
  ]).then(function(r) {
    allCategories = r[0] || [];
    var rawProducts = r[1] || [];
    var rawSizes    = r[2] || [];
    allExtras   = r[3] || [];
    allBranches = r[4] || [];

    var sizesByProduct = {};
    rawSizes.forEach(function(s) {
      if (!sizesByProduct[s.product_id]) sizesByProduct[s.product_id] = [];
      sizesByProduct[s.product_id].push(s);
    });
    allProducts = rawProducts.map(function(p) {
      p.sizes = sizesByProduct[p.id] || [];
      return p;
    });
  });
}

// ── NAVEGACIÓN ────────────────────────────────────────────────────────────────
function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  var btns = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('onclick') && btns[i].getAttribute('onclick').includes(section)) {
      btns[i].classList.add('active'); break;
    }
  }
  var titles = { dashboard: 'Dashboard', productos: 'Productos', extras: 'Ingredientes extras', sucursales: 'Sucursales', papelera: 'Papelera' };
  document.getElementById('topbarTitle').textContent = titles[section] || section;

  var actions = document.getElementById('topbarActions');
  actions.innerHTML = '';

  if (section === 'productos') {
    actions.innerHTML = '<button class="btn-primary" onclick="openNewProduct()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nuevo producto</button>';
    renderProductos();
  } else if (section === 'extras') {
    actions.innerHTML = '<button class="btn-primary" onclick="openNewExtra()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nuevo ingrediente</button>';
    renderExtras();
  } else if (section === 'sucursales') {
    actions.innerHTML = '<button class="btn-primary" onclick="openNewBranch()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nueva sucursal</button>';
    renderSucursales();
  } else if (section === 'papelera') {
    renderPapelera();
  } else {
    renderDashboard();
  }
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  var active   = allProducts.filter(function(p) { return p.active && !p.deleted_at; }).length;
  var trashed  = allProducts.filter(function(p) { return p.deleted_at; }).length;
  var inactive = allProducts.filter(function(p) { return !p.active && !p.deleted_at; }).length;

  document.getElementById('adminContent').innerHTML =
    '<div class="stats-grid">'
  + '<div class="stat-card"><div class="stat-label">Productos activos</div><div class="stat-value">' + active + '</div><div class="stat-sub">En el menú actual</div></div>'
  + '<div class="stat-card"><div class="stat-label">Categorías</div><div class="stat-value">' + allCategories.length + '</div><div class="stat-sub">Secciones del menú</div></div>'
  + '<div class="stat-card"><div class="stat-label">Extras disponibles</div><div class="stat-value">' + allExtras.filter(function(e){return e.active;}).length + '</div><div class="stat-sub">Ingredientes adicionales</div></div>'
  + '<div class="stat-card"><div class="stat-label">Sucursales</div><div class="stat-value">' + allBranches.filter(function(b){return b.active;}).length + '</div><div class="stat-sub">Activas</div></div>'
  + '<div class="stat-card"><div class="stat-label">En papelera</div><div class="stat-value">' + trashed + '</div><div class="stat-sub">Se eliminan en 30 días</div></div>'
  + '</div>'
  + '<h3 style="margin-bottom:14px;font-size:0.9rem;color:var(--muted)">ACCESOS RÁPIDOS</h3>'
  + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
  + '<button class="btn-primary" onclick="showSection(\'productos\')">Ver productos</button>'
  + '<button class="btn-secondary" onclick="showSection(\'extras\')">Editar ingredientes</button>'
  + '<button class="btn-secondary" onclick="showSection(\'papelera\')">Ver papelera</button>'
  + '</div>';
}

// ── PRODUCTOS ─────────────────────────────────────────────────────────────────
function renderProductos() {
  var catTabs = '<div class="cat-tabs">'
    + '<button class="cat-tab' + (!currentCatFilter ? ' active' : '') + '" onclick="filterCat(null)">Todos</button>';
  allCategories.forEach(function(c) {
    catTabs += '<button class="cat-tab' + (currentCatFilter === c.id ? ' active' : '') + '" onclick="filterCat(\'' + c.id + '\')">' + c.name + '</button>';
  });
  catTabs += '</div>';

  var filtered = allProducts.filter(function(p) {
    if (p.deleted_at) return false;
    if (currentCatFilter && p.category_id !== currentCatFilter) return false;
    return true;
  });

  var grid = '<div class="products-grid">';
  if (filtered.length === 0) {
    grid += '<div class="empty-state"><div class="empty-icon">🍕</div><p>No hay productos en esta categoría</p></div>';
  } else {
    filtered.forEach(function(p) {
      var catName = '';
      for (var i = 0; i < allCategories.length; i++) {
        if (allCategories[i].id === p.category_id) { catName = allCategories[i].name; break; }
      }
      var sizeTags = p.sizes.map(function(s) {
        return '<span class="size-tag">' + s.label + ' $' + parseFloat(s.price).toFixed(2) + '</span>';
      }).join('');

      grid += '<div class="product-card" id="pcard-' + p.id + '">'
            + '<div class="product-card-img">'
            + (p.img_url ? '<img src="' + p.img_url + '" alt="' + p.name + '">' : '<div class="product-card-img-placeholder">🍕</div>')
            + '<div class="product-card-img-overlay">'
            + '<button class="img-action-btn" onclick="openImgUpload(\'' + p.id + '\')">📷 Cambiar foto</button>'
            + '</div></div>'
            + '<div class="product-card-body">'
            + '<div class="product-card-name">' + p.name + (p.active ? '' : ' <span style="color:var(--muted);font-size:0.7rem">(inactivo)</span>') + '</div>'
            + '<div class="product-card-desc">' + (p.description || '') + '</div>'
            + '<div class="product-card-sizes">' + sizeTags + '</div>'
            + '</div>'
            + '<div class="product-card-actions">'
            + '<button class="action-btn" onclick="openEditProduct(\'' + p.id + '\')">✏️ Editar</button>'
            + '<button class="action-btn" onclick="duplicateProduct(\'' + p.id + '\')">📋 Duplicar</button>'
            + '<button class="action-btn danger" onclick="trashProduct(\'' + p.id + '\')">🗑️ Archivar</button>'
            + '</div></div>';
    });
  }
  grid += '</div>';

  document.getElementById('adminContent').innerHTML = catTabs + grid;
}

function filterCat(catId) {
  currentCatFilter = catId;
  renderProductos();
}

// ── MODAL PRODUCTO ────────────────────────────────────────────────────────────
function openNewProduct() {
  editingProductId = null;
  uploadedImgUrl   = null;
  document.getElementById('modalTitle').textContent = 'Nuevo producto';
  document.getElementById('pName').value    = '';
  document.getElementById('pDesc').value    = '';
  document.getElementById('pAllowExtras').checked = true;
  document.getElementById('pFreeExtras').value    = '0';
  document.getElementById('imgPreview').style.display = 'none';
  populateCatSelect(null);
  document.getElementById('sizesList').innerHTML = '';
  addSizeRow();
  document.getElementById('productModal').classList.add('open');
}

function openEditProduct(id) {
  var p = null;
  for (var i = 0; i < allProducts.length; i++) {
    if (allProducts[i].id === id) { p = allProducts[i]; break; }
  }
  if (!p) return;
  editingProductId = id;
  uploadedImgUrl   = p.img_url || null;
  document.getElementById('modalTitle').textContent = 'Editar — ' + p.name;
  document.getElementById('pName').value    = p.name;
  document.getElementById('pDesc').value    = p.description || '';
  document.getElementById('pAllowExtras').checked = p.allow_extras;
  document.getElementById('pFreeExtras').value    = p.free_extras || 0;

  if (p.img_url) {
    var prev = document.getElementById('imgPreview');
    prev.src = p.img_url; prev.style.display = 'block';
  } else {
    document.getElementById('imgPreview').style.display = 'none';
  }

  populateCatSelect(p.category_id);

  var list = document.getElementById('sizesList');
  list.innerHTML = '';
  p.sizes.forEach(function(s) { addSizeRow(s.label, s.price, s.id); });

  document.getElementById('productModal').classList.add('open');
}

function closeProductModal() {
  document.getElementById('productModal').classList.remove('open');
}

function populateCatSelect(selectedId) {
  var sel = document.getElementById('pCategory');
  sel.innerHTML = '';
  allCategories.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    if (c.id === selectedId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function addSizeRow(label, price, sizeId) {
  var row = document.createElement('div');
  row.className = 'size-row';
  row.dataset.sizeId = sizeId || '';
  row.innerHTML = '<input type="text" placeholder="Tamaño (ej: 33 cm)" value="' + (label || '') + '" class="size-label-input">'
                + '<span class="size-row-sep">·</span>'
                + '$<input type="number" placeholder="0.00" step="0.5" min="0" value="' + (price || '') + '" class="size-price-input size-row-price">'
                + '<button class="size-del-btn" onclick="this.parentElement.remove()">✕</button>';
  document.getElementById('sizesList').appendChild(row);
}

function previewImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('La imagen no puede superar 2MB', 'error'); return; }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var prev = document.getElementById('imgPreview');
    prev.src = ev.target.result; prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
  uploadImgToSupabase(file);
}

function uploadImgToSupabase(file) {
  var ext      = file.name.split('.').pop();
  var filename = 'products/' + Date.now() + '.' + ext;
  fetch(SUPABASE_URL + '/storage/v1/object/menu-images/' + filename, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (authToken || SUPABASE_KEY),
      'Content-Type': file.type,
    },
    body: file,
  }).then(function(r) {
    if (r.ok) {
      uploadedImgUrl = SUPABASE_URL + '/storage/v1/object/public/menu-images/' + filename;
      showToast('Imagen subida ✓', 'success');
    } else { showToast('Error subiendo imagen', 'error'); }
  });
}

function openImgUpload(productId) {
  editingProductId = productId;
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { showToast('La imagen no puede superar 2MB', 'error'); return; }
    var ext      = file.name.split('.').pop();
    var filename = 'products/' + Date.now() + '.' + ext;
    fetch(SUPABASE_URL + '/storage/v1/object/menu-images/' + filename, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + authToken,
        'Content-Type': file.type,
      },
      body: file,
    }).then(function(r) {
      if (r.ok) {
        var imgUrl = SUPABASE_URL + '/storage/v1/object/public/menu-images/' + filename;
        return sbAuthFetch('PATCH', 'products', 'id=eq.' + productId, { img_url: imgUrl });
      }
    }).then(function() {
      showToast('Foto actualizada ✓', 'success');
      loadAllData().then(function() { renderProductos(); });
    }).catch(function() { showToast('Error actualizando foto', 'error'); });
  };
  input.click();
}

function saveProduct() {
  var name    = document.getElementById('pName').value.trim();
  var desc    = document.getElementById('pDesc').value.trim();
  var catId   = document.getElementById('pCategory').value;
  var allow   = document.getElementById('pAllowExtras').checked;
  var freeEx  = parseInt(document.getElementById('pFreeExtras').value) || 0;

  if (!name) { showToast('El nombre es obligatorio', 'error'); return; }

  var rows    = document.querySelectorAll('#sizesList .size-row');
  var sizes   = [];
  var valid   = true;
  rows.forEach(function(row, idx) {
    var lbl = row.querySelector('.size-label-input').value.trim();
    var prc = parseFloat(row.querySelector('.size-price-input').value);
    if (!lbl || isNaN(prc)) { valid = false; return; }
    sizes.push({ label: lbl, price: prc, sort_order: idx, sizeId: row.dataset.sizeId });
  });
  if (!valid || sizes.length === 0) { showToast('Completa todos los tamaños y precios', 'error'); return; }

  var productData = {
    name: name, description: desc, category_id: catId,
    allow_extras: allow, free_extras: freeEx,
    img_url: uploadedImgUrl || null, active: true,
  };

  var promise;
  if (editingProductId) {
    promise = sbAuthFetch('PATCH', 'products', 'id=eq.' + editingProductId, productData)
      .then(function() {
        return sbAuthFetch('DELETE', 'product_sizes', 'product_id=eq.' + editingProductId);
      })
      .then(function() {
        var inserts = sizes.map(function(s, i) {
          return { product_id: editingProductId, label: s.label, price: s.price, sort_order: i };
        });
        return sbAuthFetch('POST', 'product_sizes', '', inserts);
      });
  } else {
    promise = sbAuthFetch('POST', 'products', '', productData)
      .then(function(newP) {
        var pid = Array.isArray(newP) ? newP[0].id : newP.id;
        var inserts = sizes.map(function(s, i) {
          return { product_id: pid, label: s.label, price: s.price, sort_order: i };
        });
        return sbAuthFetch('POST', 'product_sizes', '', inserts);
      });
  }

  promise.then(function() {
    showToast(editingProductId ? 'Producto actualizado ✓' : 'Producto creado ✓', 'success');
    closeProductModal();
    loadAllData().then(function() { renderProductos(); });
  }).catch(function() { showToast('Error guardando producto', 'error'); });
}

function duplicateProduct(id) {
  var p = null;
  for (var i = 0; i < allProducts.length; i++) {
    if (allProducts[i].id === id) { p = allProducts[i]; break; }
  }
  if (!p) return;
  var copy = {
    name: p.name + ' (copia)', description: p.description,
    category_id: p.category_id, allow_extras: p.allow_extras,
    free_extras: p.free_extras, img_url: p.img_url, active: false,
  };
  sbAuthFetch('POST', 'products', '', copy)
    .then(function(newP) {
      var pid = Array.isArray(newP) ? newP[0].id : newP.id;
      var inserts = p.sizes.map(function(s, i) {
        return { product_id: pid, label: s.label, price: s.price, sort_order: i };
      });
      return sbAuthFetch('POST', 'product_sizes', '', inserts);
    })
    .then(function() {
      showToast('Producto duplicado ✓', 'success');
      loadAllData().then(function() { renderProductos(); });
    }).catch(function() { showToast('Error duplicando', 'error'); });
}

function trashProduct(id) {
  if (!confirm('¿Archivar este producto? Puedes restaurarlo desde la papelera en los próximos 30 días.')) return;
  sbAuthFetch('PATCH', 'products', 'id=eq.' + id, { deleted_at: new Date().toISOString(), active: false })
    .then(function() {
      showToast('Producto archivado', 'success');
      loadAllData().then(function() { renderProductos(); });
    }).catch(function() { showToast('Error archivando', 'error'); });
}

// ── EXTRAS ────────────────────────────────────────────────────────────────────
function renderExtras() {
  var list = '<div class="extras-list">';
  if (allExtras.length === 0) {
    list += '<div class="empty-state"><div class="empty-icon">🧅</div><p>No hay ingredientes extras</p></div>';
  } else {
    allExtras.forEach(function(e) {
      list += '<div class="extra-row">'
            + '<div class="extra-row-name">' + e.name + (e.active ? '' : ' <span style="color:var(--muted);font-size:0.72rem">(inactivo)</span>') + '</div>'
            + '<div class="extra-row-price">$' + parseFloat(e.price).toFixed(2) + '</div>'
            + '<div class="extra-row-actions">'
            + '<button class="action-btn" onclick="openEditExtra(\'' + e.id + '\')">✏️</button>'
            + '<button class="action-btn danger" onclick="deleteExtra(\'' + e.id + '\')">🗑️</button>'
            + '</div></div>';
    });
  }
  list += '</div>';
  document.getElementById('adminContent').innerHTML = list;
}

function openNewExtra() {
  editingExtraId = null;
  document.getElementById('extraModalTitle').textContent = 'Nuevo ingrediente';
  document.getElementById('eName').value  = '';
  document.getElementById('ePrice').value = '';
  document.getElementById('extraModal').classList.add('open');
}

function openEditExtra(id) {
  var e = null;
  for (var i = 0; i < allExtras.length; i++) {
    if (allExtras[i].id === id) { e = allExtras[i]; break; }
  }
  if (!e) return;
  editingExtraId = id;
  document.getElementById('extraModalTitle').textContent = 'Editar — ' + e.name;
  document.getElementById('eName').value  = e.name;
  document.getElementById('ePrice').value = e.price;
  document.getElementById('extraModal').classList.add('open');
}

function closeExtraModal() { document.getElementById('extraModal').classList.remove('open'); }

function saveExtra() {
  var name  = document.getElementById('eName').value.trim();
  var price = parseFloat(document.getElementById('ePrice').value);
  if (!name || isNaN(price)) { showToast('Completa todos los campos', 'error'); return; }

  var data    = { name: name, price: price, active: true };
  var promise = editingExtraId
    ? sbAuthFetch('PATCH', 'extras', 'id=eq.' + editingExtraId, data)
    : sbAuthFetch('POST',  'extras', '', data);

  promise.then(function() {
    showToast(editingExtraId ? 'Extra actualizado ✓' : 'Extra creado ✓', 'success');
    closeExtraModal();
    loadAllData().then(renderExtras);
  }).catch(function() { showToast('Error guardando', 'error'); });
}

function deleteExtra(id) {
  if (!confirm('¿Eliminar este ingrediente?')) return;
  sbAuthFetch('DELETE', 'extras', 'id=eq.' + id)
    .then(function() {
      showToast('Eliminado ✓', 'success');
      loadAllData().then(renderExtras);
    }).catch(function() { showToast('Error eliminando', 'error'); });
}

// ── SUCURSALES ────────────────────────────────────────────────────────────────
function renderSucursales() {
  var list = '<div style="display:flex;flex-direction:column;gap:12px">';
  allBranches.forEach(function(b) {
    list += '<div class="extra-row" style="flex-direction:column;align-items:flex-start;gap:8px">'
          + '<div style="display:flex;width:100%;align-items:center;gap:10px">'
          + '<div style="flex:1"><div style="font-weight:700">' + b.name + '</div>'
          + '<div style="font-size:0.75rem;color:var(--muted);margin-top:2px">' + b.address + '</div>'
          + '<div style="font-size:0.72rem;color:var(--gold);margin-top:2px">' + (b.phones || []).join(' / ') + '</div></div>'
          + '<div class="extra-row-actions">'
          + '<button class="action-btn" onclick="openEditBranch(\'' + b.id + '\')">✏️ Editar</button>'
          + '</div></div></div>';
  });
  list += '</div>';
  document.getElementById('adminContent').innerHTML = list;
}

function openNewBranch() {
  editingBranchId = null;
  document.getElementById('branchModalTitle').textContent = 'Nueva sucursal';
  document.getElementById('bName').value   = '';
  document.getElementById('bAddr').value   = '';
  document.getElementById('bPhones').value = '';
  document.getElementById('branchModal').classList.add('open');
}

function openEditBranch(id) {
  var b = null;
  for (var i = 0; i < allBranches.length; i++) {
    if (allBranches[i].id === id) { b = allBranches[i]; break; }
  }
  if (!b) return;
  editingBranchId = id;
  document.getElementById('branchModalTitle').textContent = 'Editar — ' + b.name;
  document.getElementById('bName').value   = b.name;
  document.getElementById('bAddr').value   = b.address || '';
  document.getElementById('bPhones').value = (b.phones || []).join('\n');
  document.getElementById('branchModal').classList.add('open');
}

function closeBranchModal() { document.getElementById('branchModal').classList.remove('open'); }

function saveBranch() {
  var name   = document.getElementById('bName').value.trim();
  var addr   = document.getElementById('bAddr').value.trim();
  var phones = document.getElementById('bPhones').value.trim().split('\n').map(function(p){ return p.trim(); }).filter(Boolean);
  if (!name) { showToast('El nombre es obligatorio', 'error'); return; }

  var slug = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  var data = { name: name, address: addr, phones: phones, active: true, slug: slug };

  var promise = editingBranchId
    ? sbAuthFetch('PATCH', 'branches', 'id=eq.' + editingBranchId, data)
    : sbAuthFetch('POST',  'branches', '', data);

  promise.then(function() {
    showToast(editingBranchId ? 'Sucursal actualizada ✓' : 'Sucursal creada ✓', 'success');
    closeBranchModal();
    loadAllData().then(renderSucursales);
  }).catch(function() { showToast('Error guardando sucursal', 'error'); });
}

// ── PAPELERA ──────────────────────────────────────────────────────────────────
function renderPapelera() {
  var trashed = allProducts.filter(function(p) { return p.deleted_at; });

  if (trashed.length === 0) {
    document.getElementById('adminContent').innerHTML =
      '<div class="empty-state"><div class="empty-icon">🗑️</div><p>La papelera está vacía</p></div>';
    return;
  }

  var list = '<div style="display:flex;flex-direction:column;gap:10px">';
  trashed.forEach(function(p) {
    var daysLeft = 30 - Math.floor((Date.now() - new Date(p.deleted_at)) / 86400000);
    var urgent   = daysLeft <= 7;
    list += '<div class="trash-card">'
          + (p.img_url ? '<img src="' + p.img_url + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover">' : '<div style="width:48px;height:48px;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem">🍕</div>')
          + '<div class="trash-card-info">'
          + '<div class="trash-card-name">' + p.name + '</div>'
          + '<div class="trash-card-meta">Archivado el ' + new Date(p.deleted_at).toLocaleDateString('es-VE') + '</div>'
          + '</div>'
          + '<span class="trash-days ' + (urgent ? 'urgent' : 'ok') + '">' + daysLeft + ' días restantes</span>'
          + '<div class="trash-actions">'
          + '<button class="action-btn" onclick="restoreProduct(\'' + p.id + '\')">↩️ Restaurar</button>'
          + '<button class="action-btn danger" onclick="deleteForever(\'' + p.id + '\')">💀 Eliminar</button>'
          + '</div></div>';
  });
  list += '</div>';
  document.getElementById('adminContent').innerHTML = list;
}

function restoreProduct(id) {
  sbAuthFetch('PATCH', 'products', 'id=eq.' + id, { deleted_at: null, active: true })
    .then(function() {
      showToast('Producto restaurado ✓', 'success');
      loadAllData().then(renderPapelera);
    }).catch(function() { showToast('Error restaurando', 'error'); });
}

function deleteForever(id) {
  if (!confirm('¿Eliminar permanentemente? Esta acción no se puede deshacer.')) return;
  sbAuthFetch('DELETE', 'product_sizes', 'product_id=eq.' + id)
    .then(function() { return sbAuthFetch('DELETE', 'products', 'id=eq.' + id); })
    .then(function() {
      showToast('Eliminado permanentemente', 'success');
      loadAllData().then(renderPapelera);
    }).catch(function() { showToast('Error eliminando', 'error'); });
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById('adminToast');
  t.textContent = msg;
  t.className   = 'show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = ''; }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Verificar sesión guardada
var savedToken = sessionStorage.getItem('admin_token');
if (savedToken) {
  authToken = savedToken;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminApp').classList.add('visible');
  loadAllData().then(function() { showSection('dashboard'); });
}
</script>
</body>
</html>
