<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiorella B'Pizzas — Menú</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>

  <!-- ══ HEADER ══ -->
  <header class="site-header">
    <div class="header-left">
      <div class="header-logo-circle">
  <img src="images/isotipo.png" alt="Logo">
</div>
    </div>
    <div class="header-right">
      <button class="header-btn" onclick="changeBranch()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Cambiar sucursal
      </button>
      <button class="header-btn btn-cart" onclick="openCart()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Mi pedido
        <span class="header-badge" id="cartBadge">0</span>
      </button>
      <button class="header-cart-fab" onclick="openCart()" aria-label="Ver carrito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="fab-badge" id="fabBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ══ LAYOUT ══ -->
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="cat-nav" id="catNav">
        <!-- generado por JS -->
      </nav>
      <div class="sidebar-logo">
        <img src="images/logo-text.png" alt="Fiorella B'Pizzas" onerror="this.outerHTML='<p class=\'sidebar-logo-text\'>Fiorella B\'Pizzas</p>'">
      </div>
    </aside>

    <main class="main-content" id="mainContent">
  <div class="main-wrapper">

  <!-- HERO BANNER (solo combos) -->
  <div class="hero-banner" id="heroBanner">
        <div class="hero-text">
          <h2>¿Qué se te antoja hoy?</h2>
          <p>Elige tus productos y te enviamos el pedido al WhatsApp.</p>
        </div>
        <div class="hero-img">
          <img src="images/hero-pizza.png" alt="Pizza" onerror="this.style.display='none'">
        </div>
      </div>

      <!-- GRID DE PRODUCTOS -->
      <div class="products-area" id="productsArea">
        <!-- generado por JS -->
      </div>

    </div><!-- fin main-wrapper -->
    </main>
  </div>

  <!-- FAB CATEGORÍAS (móvil) -->
  <button class="cat-fab" onclick="toggleMobileNav()" aria-label="Categorías">
    ☰
  </button>

  <!-- FAB CARRITO (móvil) -->
  <button class="cart-fab" onclick="openCart()" id="cartFab" aria-label="Ver carrito">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <span class="cart-fab-badge" id="cartFabBadge">0</span>
  </button>

  <!-- ══ MODAL EXTRAS ══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="modal-header-info">
          <h3 id="modalProductName">Producto</h3>
          <span id="modalProductPrice" class="modal-header-price">$0</span>
        </div>
        <button class="modal-close-btn" onclick="closeModal()" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div class="modal-total">
          <small>Total</small>
          <span id="modalTotal">$0</span>
        </div>
        <button class="modal-confirm-btn" onclick="modalConfirm()">
          Añadir al pedido
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ CARRITO / PANEL DE PEDIDO ══ -->
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

  <aside class="cart-panel" id="cartPanel" aria-label="Tu pedido">
    <div class="cart-drag-handle" id="cartDragHandle"></div>
    <div class="cart-head-inner">
      <h2>Tu pedido</h2>
      <button class="cart-close" onclick="closeCart()" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-branch-info" id="cartBranchInfo">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
      <span id="cartBranchName">—</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="total-block">
        <div class="total-row">
          <span class="total-label">Total estimado</span>
          <span class="total-amount" id="cartTotal">$0.00</span>
        </div>
        <div class="total-sub" id="cartSub">0 productos</div>
      </div>

      <!-- Tipo de pedido -->
      <div class="field">
  <label>Tipo de pedido</label>
  <div class="order-type-selector">
    <button class="order-type-btn active" id="btnPickup" onclick="selectOrderType('pickup')">🏪 Pick-up</button>
    <button class="order-type-btn" id="btnDelivery" onclick="selectOrderType('delivery')">🛵 Delivery</button>
  </div>
</div>

<div class="field" id="locationField" style="display:none">
  <button class="location-btn" id="openMapBtn" onclick="openMapModal()">
    📍 Seleccionar ubicación de entrega
  </button>
  <p class="location-status" id="locationStatus"></p>
</div>

<!-- Modal del mapa -->
<div class="map-modal-overlay" id="mapModalOverlay">
  <div class="map-modal">
    <div class="map-modal-head">
      <h3>¿Dónde te entregamos?</h3>
      <button onclick="closeMapModal()" class="map-modal-close">✕</button>
    </div>
    <input type="text" id="mapSearch" placeholder="🔍 Busca tu dirección..." class="map-modal-search">
    <div id="map" style="width:100%;height:380px;border-radius:16px;"></div>
    <button class="map-modal-confirm" onclick="confirmMapLocation()">✓ Confirmar ubicación</button>
  </div>
</div>

      <!-- Datos del cliente -->
      <div class="field">
        <label for="custName">Nombre completo</label>
        <input type="text" id="custName" placeholder="Ej: Carlos Pérez" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="custId">Cédula de identidad</label>
        <input type="text" id="custId" placeholder="Ej: V-12.345.678" inputmode="numeric">
      </div>
      <div class="field">
        <label for="custNotes">Notas adicionales (opcional)</label>
        <textarea id="custNotes" rows="2" placeholder="Ej: Sin cebolla, dirección de entrega…"></textarea>
      </div>

      <!-- Botón WhatsApp -->
      <button class="wa-btn" id="waSendBtn" onclick="sendWA()" disabled>
        <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Enviar pedido por WhatsApp
      </button>
      <p class="disclaimer">El precio del delivery no está incluido. La sucursal confirmará el total final.</p>

      <!-- Espacio reservado para futuras funciones de pago -->
      <!-- FUTURE: checkout flow, QR payment, order tracking -->
    </div>
  </aside>

  <script src="js/supabase.js"></script>
  <script src="js/menu.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_W5_ZUyStaXyVaaBVOTZZPekFmF5M1II&libraries=places&callback=initMap" async defer></script>
  <div class="mobile-nav" id="mobileNav">
  <!-- generado por JS -->
</div>
</body>
</html>
